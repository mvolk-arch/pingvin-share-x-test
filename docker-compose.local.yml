services:
  pingvin-share-x:
    container_name: pingvin-share-x-dev
    build: .
    restart: unless-stopped
    ports:
      - 3001:3000
    environment:
      - TRUST_PROXY=true
    volumes:
      - "./data:/opt/app/backend/data:rw,z"
      - "./data/images:/opt/app/frontend/public/img:rw,z"
#      - "./config.yaml:/opt/app/config.yaml"


    networks:
      proxy:
        ipv4_address: 10.50.10.101

networks:
  proxy:
    external: true